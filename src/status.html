<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PwnBrave status</title>
  <style>
    :root { --bg:#1b1d21; --panel:#24272c; --fg:#e6e6e6; --muted:#9aa0a6; --line:#34383f; }
    * { box-sizing: border-box; }
    body { margin:0; padding:20px 24px; background:var(--bg); color:var(--fg);
           font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1 { font-size:18px; margin:0 0 4px; }
    h2 { font-size:13px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted);
         margin:22px 0 8px; font-weight:600; }
    .sub { color:var(--muted); font-size:12px; margin-bottom:18px; }
    table { border-collapse:collapse; width:100%; background:var(--panel);
            border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); font-size:13px; }
    th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
    tr:last-child td { border-bottom:0; }
    td.mono, th.mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:7px;
           vertical-align:-1px; }
    .muted { color:var(--muted); }
    .url { max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    pre { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:12px 14px; overflow:auto; font-size:12px; color:#cfd3d8; }
    .pill { display:inline-block; padding:1px 8px; border-radius:999px; border:1px solid var(--line);
            font-size:11px; color:var(--muted); }
  </style>
</head>
<body>
  <h1>PwnBrave status</h1>
  <div class="sub" id="summary">loading…</div>

  <h2>Containers</h2>
  <table id="containers"></table>

  <h2>Tabs</h2>
  <table id="tabs"></table>

  <h2>Plain text (for tooling)</h2>
  <pre id="plain"></pre>

  <script type="module" src="status.js"></script>
</body>
</html>
